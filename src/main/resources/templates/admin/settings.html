<!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Admin Settings</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f8fafc;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    height:100vh;
    position:fixed;

    background:
    linear-gradient(
    180deg,
    #0f172a,
    #1e1b4b,
    #312e81,
    #2563eb
    );

    padding:30px 20px;
    color:white;
}

.sidebar h2{
    text-align:center;
    margin-bottom:40px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:16px;
    border-radius:14px;
    margin-bottom:12px;
    transition:0.3s;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.12);
}

.active{
    background:rgba(255,255,255,0.18);
}

/* MAIN */

.main{
    margin-left:260px;
    flex:1;
    padding:35px;
}

.title{
    font-size:34px;
    margin-bottom:30px;
    color:#1e293b;
}

/* CARD */

.card{
    background:white;
    border-radius:25px;
    padding:35px;
    max-width:700px;

    box-shadow:
    0 8px 20px rgba(0,0,0,0.05);
}

/* FORM */

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:600;
    color:#334155;
}

input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid #cbd5e1;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

/* BUTTON */

.btn{
    border:none;
    padding:14px 20px;
    border-radius:14px;
    background:
    linear-gradient(
    135deg,
    #2563eb,
    #7c3aed
    );

    color:white;
    font-weight:600;
    cursor:pointer;
}

.success{
    background:#dcfce7;
    color:#166534;
    padding:15px;
    border-radius:14px;
    margin-bottom:20px;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>🛠 CashMate</h2>

    <div class="menu">

        <a href="/admin/dashboard-admin" >
            <span>📊</span> Dashboard
        </a>

        <a href="/admin/users">
            <span>👤</span> Kelola User
        </a>

        <a href="/admin/transaksi">
            <span>💸</span> Kelola Transaksi
        </a>

        <a href="/admin/laporan">
            <span>🧾</span> Laporan
        </a>

        <a href="/admin/settings" class="active">
            <span>⚙</span> Settings
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="main">

    <h1 class="title">
        Admin Settings
    </h1>

    <div class="card">

        <div
        th:if="${param.success}"
        class="success">

            Profile berhasil diupdate 😭🔥

        </div>

        <form
        action="/admin/settings/update"
        method="post">

            <input
            type="hidden"
            name="id"
            th:value="${admin.id}">

            <div class="form-group">

                <label>Nama</label>

                <input
                type="text"
                name="nama"
                th:value="${admin.nama}">

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                type="email"
                name="email"
                th:value="${admin.email}">

            </div>

            <div class="form-group">

                <label>Password Baru</label>

                <input
                type="password"
                name="password">

            </div>

            <button class="btn">

                Save Changes

            </button>

        </form>

    </div>

</div>

</body>

</html>
