<!DOCTYPE html>
<html
xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Admin Settings</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f8fafc;
    display:flex;
}

        /* SIDEBAR */
        .sidebar{
            width:260px;
            height:100vh;
            position:fixed;
            left:0;
            top:0;

            background:
            linear-gradient(
            180deg,
            #0f172a,
            #1e1b4b,
            #312e81,
            #2563eb
            );

            background-size:400% 400%;
            animation:gradientMove 12s ease infinite;

            padding:30px 20px;
            color:white;
            overflow-y:auto;
            z-index:1000;
            box-shadow:6px 0 25px rgba(37,99,235,0.25);
        }

        @keyframes gradientMove{
            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }
        }

        .sidebar h2{
            text-align:center;
            margin-bottom:50px;
            font-size:30px;
            font-weight:700;
            letter-spacing:1px;
            position:relative;
        }

        .sidebar h2::after{
            content:'';
            width:80px;
            height:4px;
            border-radius:10px;
            background:linear-gradient(90deg,#60a5fa,#c084fc);
            position:absolute;
            left:50%;
            transform:translateX(-50%);
            bottom:-12px;
        }

        .menu{
            display:flex;
            flex-direction:column;
            gap:16px;
        }

        .sidebar a{
            text-decoration:none;
            color:white;
            display:flex;
            align-items:center;
            gap:14px;
            padding:17px 18px;
            border-radius:18px;
            transition:0.35s ease;
            font-size:15px;
            font-weight:500;
            position:relative;
            overflow:hidden;
        }

        .sidebar a::before{
            content:'';
            position:absolute;
            width:0%;
            height:100%;
            left:0;
            top:0;
            background:rgba(255,255,255,0.1);
            transition:0.4s;
        }

        .sidebar a:hover::before{
            width:100%;
        }

        .sidebar a:hover{
            transform:translateX(8px) scale(1.02);
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }

        .sidebar a.active{
            background:rgba(255,255,255,0.18);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.15);
            font-weight:600;
            box-shadow:0 10px 25px rgba(255,255,255,0.08);
        }

.active{
    background:rgba(255,255,255,0.18);
}

/* MAIN */

.main{
    margin-left:260px;
    flex:1;
    padding:35px;
}

.title{
    font-size:34px;
    margin-bottom:30px;
    color:#1e293b;
}

/* CARD */

.card{
    background:white;
    border-radius:25px;
    padding:35px;
    max-width:700px;

    box-shadow:
    0 8px 20px rgba(0,0,0,0.05);
}

/* FORM */

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:600;
    color:#334155;
}

input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid #cbd5e1;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

/* BUTTON */

.btn{
    border:none;
    padding:14px 20px;
    border-radius:14px;
    background:
    linear-gradient(
    135deg,
    #2563eb,
    #7c3aed
    );

    color:white;
    font-weight:600;
    cursor:pointer;
}

.success{
    background:#dcfce7;
    color:#166534;
    padding:15px;
    border-radius:14px;
    margin-bottom:20px;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>🛠 CashMate</h2>

    <div class="menu">

        <a href="/admin" >
            <span>📊</span> Dashboard
        </a>

        <a href="/admin/users">
            <span>👤</span> Kelola User
        </a>

        <a href="/admin/transaksi">
            <span>💸</span> Kelola Transaksi
        </a>

        <a href="/admin/laporan">
            <span>🧾</span> Laporan
        </a>

        <a href="/admin/settings" class="active">
            <span>⚙</span> Settings
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="main">

    <h1 class="title">
        Admin Settings
    </h1>

    <div class="card">

        <div
        th:if="${param.success}"
        class="success">

            Profile berhasil diupdate 😭🔥

        </div>

        <form
        action="/admin/settings/update"
        method="post">

            <input
            type="hidden"
            name="id"
            th:value="${admin.id}">

            <div class="form-group">

                <label>Nama</label>

                <input
                type="text"
                name="nama"
                th:value="${admin.nama}">

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                type="email"
                name="email"
                th:value="${admin.email}">

            </div>

            <div class="form-group">

                <label>Password Baru</label>

                <input
                type="password"
                name="password">

            </div>

            <button class="btn">

                Save Changes

            </button>

        </form>

    </div>

</div>

</body>

</html>
