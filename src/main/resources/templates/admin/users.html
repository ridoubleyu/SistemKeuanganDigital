<!DOCTYPE html>
<html lang="en"
xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kelola User</title>

    <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#f8fafc;
            color:#1e293b;
            overflow-x:hidden;
        }

        /* SIDEBAR */
        .sidebar{
            width:260px;
            height:100vh;
            position:fixed;
            left:0;
            top:0;

            background:
            linear-gradient(
            180deg,
            #0f172a,
            #1e1b4b,
            #312e81,
            #2563eb
            );

            background-size:400% 400%;
            animation:gradientMove 12s ease infinite;

            padding:30px 20px;
            color:white;
            overflow-y:auto;
            z-index:1000;
            box-shadow:6px 0 25px rgba(37,99,235,0.25);
        }

        @keyframes gradientMove{
            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }
        }

        .sidebar h2{
            text-align:center;
            margin-bottom:50px;
            font-size:30px;
            font-weight:700;
            letter-spacing:1px;
            position:relative;
        }

        .sidebar h2::after{
            content:'';
            width:80px;
            height:4px;
            border-radius:10px;
            background:linear-gradient(90deg,#60a5fa,#c084fc);
            position:absolute;
            left:50%;
            transform:translateX(-50%);
            bottom:-12px;
        }

        .menu{
            display:flex;
            flex-direction:column;
            gap:16px;
        }

        .sidebar a{
            text-decoration:none;
            color:white;
            display:flex;
            align-items:center;
            gap:14px;
            padding:17px 18px;
            border-radius:18px;
            transition:0.35s ease;
            font-size:15px;
            font-weight:500;
            position:relative;
            overflow:hidden;
        }

        .sidebar a::before{
            content:'';
            position:absolute;
            width:0%;
            height:100%;
            left:0;
            top:0;
            background:rgba(255,255,255,0.1);
            transition:0.4s;
        }

        .sidebar a:hover::before{
            width:100%;
        }

        .sidebar a:hover{
            transform:translateX(8px) scale(1.02);
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }

        .sidebar a.active{
            background:rgba(255,255,255,0.18);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.15);
            font-weight:600;
            box-shadow:0 10px 25px rgba(255,255,255,0.08);
        }

        .menu{
            display:flex;
            flex-direction:column;
            gap:16px;
        }



        .main{
            margin-left:260px;
            padding:35px;
            min-height:100vh;
        }

        .topbar{
            background:rgba(255,255,255,0.92);
            backdrop-filter:blur(10px);
            padding:28px 35px;
            border-radius:28px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:20px;
            box-shadow:0 8px 25px rgba(0,0,0,0.06);
        }

        .topbar h1{
            font-size:36px;
            margin-bottom:8px;
            color:#1e293b;
        }

        .topbar p{
            color:#64748b;
            font-size:15px;
        }


        /* MAIN */

        .main{
            margin-left:260px;
            padding:35px;
        }

        /* HEADER */

        .header{
            margin-bottom:30px;
        }

        .header h1{
            font-size:36px;
            color:#1e293b;
        }

        /* CARD */

        .glass-card{
            background:white;
            border-radius:28px;
            padding:30px;
            box-shadow:0 8px 20px rgba(0,0,0,0.06);
        }

        /* FORM */

        .form-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
            margin-bottom:25px;
        }

        input,
        select{
            width:100%;
            padding:14px;
            border:none;
            border-radius:14px;
            background:#f1f5f9;
            outline:none;
        }

        /* BUTTON */

        .btn{
            background:
            linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
            );

            color:white;

            border:none;

            padding:14px 22px;

            border-radius:14px;

            cursor:pointer;

            font-weight:600;

            transition:0.3s;
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .delete-btn{
            background:#ef4444;
        }

        /* TABLE */

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:30px;
        }

        table th{
            background:
            linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
            );

            color:white;

            padding:16px;

            text-align:left;
        }

        table td{
            padding:16px;
            border-bottom:1px solid #e5e7eb;
        }

        table tr:hover{
            background:#f8fafc;
        }

        /* RESPONSIVE */

        @media(max-width:768px){

            .sidebar{
                width:100%;
                height:auto;
                position:relative;
            }

            .main{
                margin-left:0;
                padding:20px;
            }

            .form-grid{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>🛠 CashMate</h2>

    <div class="menu">

        <a href="/admin">
            <span>📊</span> Dashboard
        </a>

        <a href="/admin/users"  class="active">
            <span>👤</span> Kelola User
        </a>

        <a href="/admin/transaksi">
            <span>💸</span> Kelola Transaksi
        </a>

        <a href="/admin/laporan">
            <span>🧾</span> Laporan
        </a>

        <a href="/admin/settings">
            <span>⚙</span> Settings
        </a>

    </div>

</div>

<!-- MAIN -->

<div class="main">

    <div class="header">

        <h1>Kelola User</h1>

    </div>

    <div class="glass-card">

        <!-- FORM -->

        <form
                th:action="@{/admin/users/add}"
                method="post"
                th:object="${newUser}"
        >

            <div class="form-grid">

                <input
                        type="text"
                        th:field="*{nama}"
                        placeholder="Nama User"
                >

                <input
                        type="email"
                        th:field="*{email}"
                        placeholder="Email"
                >

                <input
                        type="password"
                        th:field="*{password}"
                        placeholder="Password"
                >

                <select th:field="*{role}">

                    <option value="USER">
                        USER
                    </option>

                    <option value="ADMIN">
                        ADMIN
                    </option>

                </select>

            </div>

            <button class="btn"
                    type="submit">

                Tambah User

            </button>

        </form>

        <!-- TABLE -->

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Nama</th>
                <th>Email</th>
                <th>Role</th>
                <th>Aksi</th>

            </tr>

            </thead>

            <tbody>

<tr th:each="u, iter : ${users}">
<td th:text="${iter.index + 1}"></td>
                <td th:text="${u.nama}"></td>

                <td th:text="${u.email}"></td>

                <td th:text="${u.role}"></td>

                <td>

                    <a
                            th:href="@{/admin/users/delete/{id}(id=${u.id})}"
                    >

                        <button
                                class="btn delete-btn">

                            Hapus

                        </button>

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
