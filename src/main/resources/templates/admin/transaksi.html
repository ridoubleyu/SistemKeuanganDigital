```html
<!DOCTYPE html>
<html lang="en"
xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Transactions</title>

    <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f8fafc;
            display:flex;
        }

        /* SIDEBAR */

        .sidebar{
            width:260px;
            height:100vh;
            position:fixed;

            background:
            linear-gradient(
            180deg,
            #0f172a,
            #1e1b4b,
            #312e81,
            #2563eb
            );

            padding:30px 20px;
            color:white;
        }

        .sidebar h2{
            text-align:center;
            margin-bottom:40px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:16px;
            border-radius:14px;
            margin-bottom:12px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:rgba(255,255,255,0.12);
        }

        .active{
            background:rgba(255,255,255,0.18);
        }

        /* MAIN */

        .main{
            margin-left:260px;
            flex:1;
            padding:35px;
        }

        .title{
            font-size:34px;
            margin-bottom:25px;
            color:#1e293b;
        }

        /* CARD */

        .card{
            background:white;
            border-radius:25px;
            padding:30px;
            box-shadow:0 8px 20px rgba(0,0,0,0.05);
        }

        /* TABLE */

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:25px;
        }

        table th{
            background:
            linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
            );

            color:white;
            padding:16px;
            text-align:left;
        }

        table td{
            padding:16px;
            border-bottom:1px solid #e5e7eb;
        }

        /* BADGE */

        .income{
            background:#dcfce7;
            color:#166534;
            padding:8px 12px;
            border-radius:20px;
            font-size:13px;
        }

        .expense{
            background:#fee2e2;
            color:#991b1b;
            padding:8px 12px;
            border-radius:20px;
            font-size:13px;
        }

        /* BUTTON */

        .btn{
            border:none;
            padding:12px 18px;
            border-radius:12px;
            color:white;
            cursor:pointer;
            font-weight:600;
        }

        .delete{
            background:#ef4444;
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>🛠 CashMate</h2>

    <div class="menu">

        <a href="/admin/dashboard-admin" >
            <span>📊</span> Dashboard
        </a>

        <a href="/admin/users">
            <span>👤</span> Kelola User
        </a>

        <a href="/admin/transaksi class="active"">
            <span>💸</span> Kelola Transaksi
        </a>

        <a href="/admin/laporan">
            <span>🧾</span> Laporan
        </a>

        <a href="/admin/settings">
            <span>⚙</span> Settings
        </a>

    </div>

</div>

<!-- MAIN -->

<div class="main">

    <h1 class="title">
        Kelola Transaksi
    </h1>

    <div class="card">

        <table>

            <thead>

            <tr>

                <th>No</th>
                <th>User</th>
                <th>Judul</th>
                <th>Kategori</th>
                <th>Tipe</th>
                <th>Nominal</th>
                <th>Tanggal</th>
                <th>Aksi</th>

            </tr>

            </thead>

<tbody>

<tr th:each="t, iter : ${transactions}">

    <td th:text="${iter.index + 1}"></td>

    <td th:text="${t.user != null ? t.user.nama : 'Tidak Ada User'}"></td>

    <td th:text="${t.nama}"></td>

    <td th:text="${t.kategori}"></td>

    <td>

        <span
        th:if="${t.jenis == 'Pemasukan'}"
        class="income">

            Pemasukan

        </span>

        <span
        th:if="${t.jenis == 'Pengeluaran'}"
        class="expense">

            Pengeluaran

        </span>

    </td>

    <td th:text="${t.jumlahRupiah}"></td>

    <td th:text="${t.tanggal}"></td>

    <td>

        <a
        th:href="@{/admin/transaksi/delete/{id}(id=${t.id})}">

            <button class="btn delete">

                Hapus

            </button>

        </a>

    </td>

</tr>

</tbody>

        </table>

    </div>

</div>

</body>

</html>
```
