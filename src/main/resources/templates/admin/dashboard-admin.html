<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins', sans-serif;
            background:#f8fafc;
            color:#1e293b;
            overflow-x:hidden;
            position:relative;
        }

        body::before{
            content:'';
            position:fixed;
            width:450px;
            height:450px;
            background:rgba(59,130,246,0.08);
            border-radius:50%;
            top:-120px;
            right:-100px;
            z-index:-1;
            animation:float1 8s ease-in-out infinite;
        }

        body::after{
            content:'';
            position:fixed;
            width:350px;
            height:350px;
            background:rgba(147,51,234,0.08);
            border-radius:50%;
            bottom:-120px;
            left:-80px;
            z-index:-1;
            animation:float2 10s ease-in-out infinite;
        }

        @keyframes float1{
            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(20px);
            }

            100%{
                transform:translateY(0px);
            }
        }

        @keyframes float2{
            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(-20px);
            }

            100%{
                transform:translateY(0px);
            }
        }

        /* SIDEBAR */
        .sidebar{
            width:260px;
            height:100vh;
            position:fixed;
            left:0;
            top:0;

            background:
            linear-gradient(
            180deg,
            #0f172a,
            #1e1b4b,
            #312e81,
            #2563eb
            );

            background-size:400% 400%;
            animation:gradientMove 12s ease infinite;

            padding:30px 20px;
            color:white;
            overflow-y:auto;
            z-index:1000;
            box-shadow:6px 0 25px rgba(37,99,235,0.25);
        }

        @keyframes gradientMove{
            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }
        }

        .sidebar h2{
            text-align:center;
            margin-bottom:50px;
            font-size:30px;
            font-weight:700;
            letter-spacing:1px;
            position:relative;
        }

        .sidebar h2::after{
            content:'';
            width:80px;
            height:4px;
            border-radius:10px;
            background:linear-gradient(90deg,#60a5fa,#c084fc);
            position:absolute;
            left:50%;
            transform:translateX(-50%);
            bottom:-12px;
        }

        .menu{
            display:flex;
            flex-direction:column;
            gap:16px;
        }

        .sidebar a{
            text-decoration:none;
            color:white;
            display:flex;
            align-items:center;
            gap:14px;
            padding:17px 18px;
            border-radius:18px;
            transition:0.35s ease;
            font-size:15px;
            font-weight:500;
            position:relative;
            overflow:hidden;
        }

        .sidebar a::before{
            content:'';
            position:absolute;
            width:0%;
            height:100%;
            left:0;
            top:0;
            background:rgba(255,255,255,0.1);
            transition:0.4s;
        }

        .sidebar a:hover::before{
            width:100%;
        }

        .sidebar a:hover{
            transform:translateX(8px) scale(1.02);
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }

        .sidebar a.active{
            background:rgba(255,255,255,0.18);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.15);
            font-weight:600;
            box-shadow:0 10px 25px rgba(255,255,255,0.08);
        }

        .main{
            margin-left:260px;
            padding:35px;
            min-height:100vh;
        }

        .topbar{
            background:rgba(255,255,255,0.92);
            backdrop-filter:blur(10px);
            padding:28px 35px;
            border-radius:28px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:20px;
            box-shadow:0 8px 25px rgba(0,0,0,0.06);
        }

        .topbar h1{
            font-size:36px;
            margin-bottom:8px;
            color:#1e293b;
        }

        .topbar p{
            color:#64748b;
            font-size:15px;
        }

        .profile{
            background:linear-gradient(135deg,#dbeafe,#ede9fe);
            padding:12px 18px;
            border-radius:16px;
            color:#4338ca;
            font-weight:600;
        }

        .cards{
            margin-top:35px;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
        }

        .card{
            position:relative;
            overflow:hidden;
            padding:30px;
            border-radius:28px;
            color:white;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            box-shadow:0 10px 25px rgba(37,99,235,0.25);
            transition:0.4s;
        }

        .card:hover{
            transform:translateY(-8px) scale(1.02);
        }

        .card::before{
            content:'';
            position:absolute;
            width:140px;
            height:140px;
            background:rgba(255,255,255,0.12);
            border-radius:50%;
            top:-40px;
            right:-30px;
        }

        .card h3{
            font-size:17px;
            color:#dbeafe;
            margin-bottom:15px;
            position:relative;
            z-index:2;
        }

        .card p{
            font-size:32px;
            font-weight:700;
            position:relative;
            z-index:2;
        }

        .section-title{
            margin-top:45px;
            margin-bottom:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .section-title h2{
            font-size:28px;
            color:#1e293b;
        }

        .btn{
            border:none;
            padding:12px 18px;
            border-radius:14px;
            cursor:pointer;
            font-weight:600;
            transition:0.3s;
        }

        .btn-add{
            background:#dbeafe;
            color:#1d4ed8;
        }

        .btn-add:hover{
            transform:translateY(-2px);
        }

        .table-container{
            background:white;
            border-radius:25px;
            overflow-x:auto;
            box-shadow:0 8px 20px rgba(0,0,0,0.06);
        }

        table{
            width:100%;
            border-collapse:collapse;
            min-width:700px;
        }

        table th{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            text-align:left;
            padding:18px;
            font-size:15px;
        }

        table td{
            padding:18px;
            border-bottom:1px solid #e5e7eb;
            font-size:14px;
        }

        table tr:hover{
            background:#f8fafc;
        }

        .badge{
            padding:8px 14px;
            border-radius:20px;
            font-size:13px;
            font-weight:600;
            display:inline-block;
        }

        .admin{
            background:#ede9fe;
            color:#5b21b6;
        }

        .user{
            background:#dcfce7;
            color:#166534;
        }

        .action-btn{
            border:none;
            padding:8px 12px;
            border-radius:10px;
            cursor:pointer;
            font-size:12px;
            font-weight:600;
        }

        .edit{
            background:#dbeafe;
            color:#1d4ed8;
        }

        .delete{
            background:#fee2e2;
            color:#991b1b;
        }

        .logout-btn{
            text-decoration:none;
            background:#ef4444;
            color:white;
            padding:12px 22px;
            border-radius:14px;
            font-weight:600;
            transition:0.3s;
            box-shadow:0 8px 20px rgba(239,68,68,0.25);
        }

        .logout-btn:hover{
            transform:translateY(-2px);
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>🛠 CashMate</h2>

    <div class="menu">

        <a href="/admin" class="active">
            <span>📊</span> Dashboard
        </a>

        <a href="/admin/users">
            <span>👤</span> Kelola User
        </a>

        <a href="/admin/transaksi">
            <span>💸</span> Kelola Transaksi
        </a>

        <a href="/admin/laporan">
            <span>🧾</span> Laporan
        </a>

        <a href="/admin/settings">
            <span>⚙</span> Settings
        </a>

    </div>

</div>

<!-- MAIN -->
<div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

        <div>
            <h1>Admin Dashboard 👑</h1>
            <p>Monitoring seluruh aktivitas aplikasi CashMate</p>
        </div>

        <div class="profile">
            👋 Welcome Admin
        </div>

        <a href="/logout" class="logout-btn">
            🚪 Logout
        </a>

    </div>

    <!-- CARDS -->
    <div class="cards">

        <div class="card">
            <h3>👤 Total User</h3>
            <p th:text="${totalUser}">0</p>
        </div>

        <div class="card">
            <h3>💸 Total Transaksi</h3>
            <p th:text="${totalTransaksi}">0</p>
        </div>

        <div class="card">
            <h3>🪙 Total Saldo</h3>
            <span th:text="${totalSaldo}"></span>
            </div>

        <div class="card">
            <h3>📈 Total Pemasukan</h3>
            <p th:text="${totalPemasukan}">Rp 0</p>
        </div>

    </div>

    <!-- TABLE -->
    <div class="section-title">

        <h2>Data User</h2>

        <button class="btn btn-add">
            ➕ Tambah User
        </button>

    </div>

    <div class="table-container">

        <table>

            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Email</th>
                <th>Role</th>
                <th>Aksi</th>
            </tr>

            <tr th:each="u : ${users}">

                <td th:text="${u.id}"></td>

                <td th:text="${u.nama}"></td>

                <td th:text="${u.email}"></td>

                <td>

                    <span th:if="${u.role == 'ADMIN'}"
                          class="badge admin">
                        Admin
                    </span>

                    <span th:if="${u.role == 'USER'}"
                          class="badge user">
                        User
                    </span>

                </td>

                <td>

                    <button class="action-btn edit">
                        ✏ Edit
                    </button>

                    <button class="action-btn delete">
                        🗑 Hapus
                    </button>

                </td>

            </tr>

        </table>

    </div>

</div>

</body>
</html>
